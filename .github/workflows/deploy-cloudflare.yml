name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  release:
    name: Build and deploy root-host export
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Require Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Cloudflare deployment not configured::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets before deploying the existing kashish project."
            exit 1
          fi

      - name: Checkout the triggering main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency lockfile
        run: npm run test:dependency-lock

      - name: Validate form schemas
        run: npm run test:validations

      - name: Build Cloudflare static export
        run: npm run build:cloudflare
        env:
          CLOUDFLARE_SITE_URL: https://kashish-cno.pages.dev

      - name: Verify Cloudflare static export routes
        run: npm run test:static-export
        env:
          EXPORT_DIR: out-cloudflare
          EXPECTED_SITE_URL: https://kashish-cno.pages.dev
          EXPECTED_BASE_PATH: ""

      - name: Deploy the verified root-host export
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out-cloudflare --project-name=kashish --branch=main --commit-hash=${{ github.sha }}
